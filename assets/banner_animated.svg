<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.3"/>
      <rect y="2" width="4" height="2" fill="transparent"/>
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#00ffff" fill-opacity="0.1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feGaussianBlur stdDeviation="20" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Glow Filter for Sick Data -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="healthyData" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .st-bg { fill: url(#bgGrad); }
      
      .glitch-text {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 72px;
        letter-spacing: 6px;
      }
      .subtitle {
        font-family: 'Share Tech Mono', monospace;
        font-size: 16px;
        fill: #00d09c;
        letter-spacing: 4px;
        opacity: 0.8;
      }
      .hud-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #0088ff;
        opacity: 0.6;
      }

      /* Glitch Animations */
      @keyframes glitch-anim-1 {
        0% { transform: translate(0); opacity: 1; }
        2% { transform: translate(-3px, 2px); opacity: 0.8; }
        4% { transform: translate(3px, -1px); opacity: 0.9; }
        6% { transform: translate(0); opacity: 1; }
        100% { transform: translate(0); opacity: 1; }
      }
      @keyframes glitch-anim-2 {
        0% { transform: translate(0); opacity: 1; }
        3% { transform: translate(3px, -2px); opacity: 0.7; }
        5% { transform: translate(-4px, 1px); opacity: 0.8; }
        7% { transform: translate(0); opacity: 1; }
        100% { transform: translate(0); opacity: 1; }
      }

      .text-cyan { fill: #00ffff; animation: glitch-anim-1 3.5s infinite linear alternate-reverse; }
      .text-magenta { fill: #ff00ff; animation: glitch-anim-2 3.1s infinite linear alternate-reverse; }
      .text-white { fill: #ffffff; }

      /* Sick Data Animation */
      @keyframes pulse-err {
        0%, 100% { stroke-width: 1; opacity: 0.4; }
        50% { stroke-width: 3; opacity: 0.9; }
      }
      .sick-path {
        stroke: #ff3366;
        fill: none;
        animation: pulse-err 0.8s infinite ease-in-out;
        filter: url(#glowRed);
      }
      .sick-path-2 {
        stroke: #ff0033;
        fill: none;
        animation: pulse-err 1.2s infinite ease-in-out reverse;
        filter: url(#glowRed);
      }

      /* Healthy Data Flow */
      @keyframes data-flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .healthy-path {
        stroke: url(#healthyData);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 10 15;
        animation: data-flow 2s infinite linear;
      }

      /* Core Rotation */
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
      .core-ring { transform-origin: 600px 175px; animation: spin 20s linear infinite; }
      .core-ring-rev { transform-origin: 600px 175px; animation: spin-reverse 15s linear infinite; }

      /* Blinking HUD Elements */
      @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
      .blinker { animation: blink 2s infinite; }
      .blinker-fast { animation: blink 0.5s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="st-bg"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  
  <!-- "Sick" AI Data Input (Left side) -->
  <g transform="translate(50, 175)">
    <!-- Chaotic signals coming in -->
    <path d="M0,0 Q50,-80 100,20 T200,-50 T300,30 T400,-10" class="sick-path"/>
    <path d="M0,20 Q60,90 120,-30 T220,60 T320,-40 T420,10" class="sick-path-2"/>
    <path d="M0,-30 Q30,-90 80,40 T180,-60 T350,50 T450,0" class="sick-path" style="animation-delay: 0.3s"/>
    
    <!-- Floating Error Hexagons -->
    <g opacity="0.6">
      <path d="M20,-40 l10,-17 l20,0 l10,17 l-10,17 l-20,0 Z" fill="none" stroke="#ff0033" stroke-width="1.5" class="blinker-fast"/>
      <path d="M150,60 l8,-14 l16,0 l8,14 l-8,14 l-16,0 Z" fill="none" stroke="#ff3366" stroke-width="1" class="blinker"/>
      <path d="M300,-80 l6,-10 l12,0 l6,10 l-6,10 l-12,0 Z" fill="#ff0033" opacity="0.4" class="blinker-fast" style="animation-delay: 0.2s"/>
    </g>

    <text x="0" y="110" class="hud-text" fill="#ff3366">
      <tspan x="0" dy="0">ERR_CORRUPTION_DETECTED: 0x8F</tspan>
      <tspan x="0" dy="15">STACK_OVERFLOW_IN_CORE</tspan>
      <tspan x="0" dy="15">AGENT_STATE: PANIC</tspan>
    </text>
  </g>

  <!-- CyberHuaTuo Core Engine (Center) -->
  <g transform="translate(600, 175)">
    <!-- Glow behind core -->
    <circle cx="0" cy="0" r="100" fill="#00ffff" opacity="0.05" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="60" fill="#00d09c" opacity="0.1" filter="url(#glow)"/>

    <!-- Concentric Rings -->
    <g class="core-ring" stroke="#00ffff" fill="none" opacity="0.6">
      <circle cx="0" cy="0" r="120" stroke-width="1" stroke-dasharray="2 6"/>
      <circle cx="0" cy="0" r="130" stroke-width="0.5"/>
      <path d="M-130,0 A130,130 0 0,1 130,0" stroke-width="3" stroke="#00d09c"/>
    </g>

    <g class="core-ring-rev" stroke="#0088ff" fill="none" opacity="0.5">
      <circle cx="0" cy="0" r="100" stroke-width="1.5" stroke-dasharray="10 20 40 20"/>
      <circle cx="0" cy="0" r="90" stroke-width="0.5" stroke-dasharray="1 3"/>
    </g>

    <g class="core-ring" style="animation-duration: 8s;" stroke="#00ffcc" fill="none" filter="url(#glow)">
      <circle cx="0" cy="0" r="70" stroke-width="2" stroke-dasharray="50 100"/>
    </g>
    
    <!-- Central Taichi/Core motif (Abstract) -->
    <path d="M0,-40 C40,-40 40,0 0,0 C-40,0 -40,40 0,40 C-60,40 -60,-40 0,-40 Z" fill="#00ffff" opacity="0.7" filter="url(#glow)"/>
    <path d="M0,40 C-40,40 -40,0 0,0 C40,0 40,-40 0,-40 C60,-40 60,40 0,40 Z" fill="#00d09c" opacity="0.7" filter="url(#glow)"/>
    
    <!-- Central bright dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#glow)"/>
    
    <!-- Vertical Energy Beam -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>
    <rect x="-2" y="-175" width="4" height="350" fill="url(#beam)"/>
  </g>

  <!-- "Healthy" Data Output (Right side) -->
  <g transform="translate(680, 175)">
    <!-- Structured data streams -->
    <path d="M0,0 L150,0 L200,-30 L400,-30" class="healthy-path"/>
    <path d="M0,20 L100,20 L130,50 L400,50" class="healthy-path" style="animation-delay: 0.5s"/>
    <path d="M0,-20 L80,-20 L120,-60 L400,-60" class="healthy-path" style="animation-delay: 1.2s"/>
    <path d="M0,-40 L60,-40 L90,-80 L400,-80" class="healthy-path" style="animation-delay: 0.2s; opacity: 0.5"/>
    <path d="M0,40 L180,40 L220,80 L400,80" class="healthy-path" style="animation-delay: 0.8s; opacity: 0.7"/>
    
    <!-- Restored Nodes -->
    <g fill="#00ffff" filter="url(#glow)">
      <circle cx="200" cy="-30" r="4"/>
      <circle cx="130" cy="50" r="3"/>
      <circle cx="120" cy="-60" r="3"/>
      <circle cx="220" cy="80" r="4"/>
      <circle cx="350" cy="-30" r="5" class="blinker"/>
      <circle cx="300" cy="50" r="2"/>
    </g>

    <!-- Matrix Code bg -->
    <text x="150" y="110" class="hud-text" fill="#00ffff">
      <tspan x="150" dy="0">SYS.RESTORE_COMPLETE()</tspan>
      <tspan x="150" dy="15">AGENT_STATE: NOMINAL_100%</tspan>
      <tspan x="150" dy="15">DIAGNOSIS_LOG: SAVED</tspan>
    </text>
  </g>

  <!-- Main Title with Glitch Effect -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- RGB Split / Glitch layers -->
    <text class="glitch-text text-cyan" x="-3" y="0">CYBERHUATUO</text>
    <text class="glitch-text text-magenta" x="3" y="0">CYBERHUATUO</text>
    <!-- Sharp white top layer -->
    <text class="glitch-text text-white" x="0" y="0">CYBERHUATUO</text>
    
    <!-- Subtitle -->
    <text class="subtitle" x="0" y="35">THE OPEN-SOURCE AI CLINIC</text>
  </g>

  <!-- HUD Overlays (Corners & Borders) -->
  <g class="hud-group" stroke="#0088ff" opacity="0.4" fill="none" stroke-width="1">
    <!-- Top Left Corner -->
    <path d="M 20 60 L 20 20 L 60 20" />
    <rect x="25" y="25" width="4" height="4" fill="#0088ff" class="blinker"/>
    <text x="35" y="30" class="hud-text">V2.0.4.ONLINE</text>
    
    <!-- Top Right Corner -->
    <path d="M 1180 60 L 1180 20 L 1140 20" />
    <text x="1100" y="30" class="hud-text">SYS_LINK_OK</text>
    
    <!-- Bottom Left Corner -->
    <path d="M 20 290 L 20 330 L 60 330" />
    <path d="M 25 320 L 40 320" stroke-width="2"/>
    <path d="M 45 320 L 50 320" stroke-width="2"/>
    
    <!-- Bottom Right Corner -->
    <path d="M 1180 290 L 1180 330 L 1140 330" />
    <text x="1060" y="325" class="hud-text blinker">AWAITING_INPUT_</text>
  </g>

  <!-- Global CRT Scanlines Overlay -->
  <rect width="100%" height="100%" fill="url(#scanlines)" pointer-events="none"/>

</svg>
