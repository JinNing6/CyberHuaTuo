<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Dark Void Background -->
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="50%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Cinematic Bloom / Neon Glow Filters -->
    <filter id="bloomBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feGaussianBlur stdDeviation="20" result="blur3" />
      <feGaussianBlur stdDeviation="40" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="bloomCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feGaussianBlur stdDeviation="15" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloomGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Space Stars Grid Pattern -->
    <pattern id="starGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="0.8" fill="#ffffff" fill-opacity="0.2"/>
    </pattern>

    <!-- Vertical Energy Beam -->
    <linearGradient id="verticalBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="60%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.0"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .tech-text { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #0088ff; }
      
      /* Stars Twinkle */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .star { fill: #fff; animation: twinkle infinite alternate ease-in-out; }
      
      /* Ring Rotations (in 3D space) */
      @keyframes spin-cw { 100% { transform: rotate(360deg); } }
      @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }
      .ring-cw { transform-origin: center; animation: spin-cw linear infinite; }
      .ring-ccw { transform-origin: center; animation: spin-ccw linear infinite; }
      
      /* Fast inner core spin */
      .core-spin { transform-origin: center; animation: spin-cw 8s linear infinite; }
      
      /* Hover glow for interactive elements */
      .node-hover { transition: filter 0.3s ease; cursor: pointer; }
      .node-hover:hover { filter: url(#bloomCyan); }

      /* Scanning lines for holographic effect */
      @keyframes scanline {
        0% { transform: translateY(-800px); }
        100% { transform: translateY(800px); }
      }
      .scan { 
        fill: url(#verticalBeam); 
        opacity: 0.1;
        animation: scanline 8s linear infinite; 
      }
    </style>

    <!-- Trigram definition (broken line = Yin, solid line = Yang) -->
    <!-- Qian (Heaven): ☰ -->
    <g id="tri-qian">
      <rect x="-15" y="-12" width="30" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="-4"  width="30" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="4"   width="30" height="4" fill="#00ffff" rx="2" />
    </g>
    <!-- Kun (Earth): ☷ -->
    <g id="tri-kun">
      <rect x="-15" y="-12" width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="3"   y="-12" width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="-15" y="-4"  width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="3"   y="-4"  width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="-15" y="4"   width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="3"   y="4"   width="12" height="4" fill="#00d09c" rx="2" />
    </g>
    <!-- Zhen (Thunder): ☳ -->
    <g id="tri-zhen">
      <rect x="-15" y="-12" width="12" height="4" fill="#0088ff" rx="2" /><rect x="3" y="-12" width="12" height="4" fill="#0088ff" rx="2" />
      <rect x="-15" y="-4"  width="12" height="4" fill="#0088ff" rx="2" /><rect x="3" y="-4"  width="12" height="4" fill="#0088ff" rx="2" />
      <rect x="-15" y="4"   width="30" height="4" fill="#0088ff" rx="2" />
    </g>
    <!-- Xun (Wind): ☴ -->
    <g id="tri-xun">
      <rect x="-15" y="-12" width="30" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="-4"  width="30" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="4"   width="12" height="4" fill="#00ffff" rx="2" /><rect x="3" y="4" width="12" height="4" fill="#00ffff" rx="2" />
    </g>
    <!-- Kan (Water): ☵ -->
    <g id="tri-kan">
      <rect x="-15" y="-12" width="12" height="4" fill="#0088ff" rx="2" /><rect x="3" y="-12" width="12" height="4" fill="#0088ff" rx="2" />
      <rect x="-15" y="-4"  width="30" height="4" fill="#0088ff" rx="2" />
      <rect x="-15" y="4"   width="12" height="4" fill="#0088ff" rx="2" /><rect x="3" y="4" width="12" height="4" fill="#0088ff" rx="2" />
    </g>
    <!-- Li (Fire): ☲ -->
    <g id="tri-li">
      <rect x="-15" y="-12" width="30" height="4" fill="#ff4444" rx="2" />
      <rect x="-15" y="-4"  width="12" height="4" fill="#ff4444" rx="2" /><rect x="3" y="-4" width="12" height="4" fill="#ff4444" rx="2" />
      <rect x="-15" y="4"   width="30" height="4" fill="#ff4444" rx="2" />
    </g>
    <!-- Gen (Mountain): ☶ -->
    <g id="tri-gen">
      <rect x="-15" y="-12" width="30" height="4" fill="#00d09c" rx="2" />
      <rect x="-15" y="-4"  width="12" height="4" fill="#00d09c" rx="2" /><rect x="3" y="-4" width="12" height="4" fill="#00d09c" rx="2" />
      <rect x="-15" y="4"   width="12" height="4" fill="#00d09c" rx="2" /><rect x="3" y="4" width="12" height="4" fill="#00d09c" rx="2" />
    </g>
    <!-- Dui (Lake): ☱ -->
    <g id="tri-dui">
      <rect x="-15" y="-12" width="12" height="4" fill="#00ffff" rx="2" /><rect x="3" y="-12" width="12" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="-4"  width="30" height="4" fill="#00ffff" rx="2" />
      <rect x="-15" y="4"   width="30" height="4" fill="#00ffff" rx="2" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#spaceGradient)"/>
  <rect width="100%" height="100%" fill="url(#starGrid)"/>

  <!-- Random shining stars -->
  <circle cx="150" cy="120" r="1.5" class="star" style="animation-duration: 3s;"/>
  <circle cx="850" cy="80" r="2.5" class="star" style="animation-duration: 5s;" filter="url(#bloomBlue)"/>
  <circle cx="1050" cy="620" r="2" class="star" style="animation-duration: 4s;"/>
  <circle cx="200" cy="650" r="1" class="star" style="animation-duration: 2.5s;"/>

  <!-- Horizontal Full-width Holographic Grid -->
  <g opacity="0.1" stroke="#00ffff" stroke-width="0.5">
    <line x1="0" y1="400" x2="1200" y2="400" stroke-width="2" filter="url(#bloomCyan)"/>
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="440" x2="1200" y2="440" />
  </g>

  <!-- 3D Holographic Projection Matrix (Scale Y to flatten disc) -->
  <!-- We apply Isometric / pseudo-3D perspective projecting the Bagua plane -->
  <g transform="translate(600, 400) scale(1, 0.45)">

    <!-- Bottom Disc Aura (Ground illumination) -->
    <circle cx="0" cy="0" r="380" fill="#0088ff" opacity="0.05" filter="url(#bloomBlue)"/>

    <!-- L1: Outermost Octagonal Boundaries -->
    <g class="ring-cw" style="animation-duration: 90s;" opacity="0.4">
      <polygon points="0,-400 282,-282 400,0 282,282 0,400 -282,282 -400,0 -282,-282" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="10 20"/>
      <circle cx="0" cy="0" r="400" fill="none" stroke="#0088ff" stroke-width="1"/>
    </g>

    <!-- L2: Counter-Rotating Middle Ring (Data stream) -->
    <g class="ring-ccw" style="animation-duration: 60s;">
      <circle cx="0" cy="0" r="320" fill="none" stroke="#00d09c" stroke-width="4" stroke-dasharray="40 100 10 20 80 50" filter="url(#bloomCyan)" opacity="0.8"/>
      <!-- Small data nodes on this ring -->
      <circle cx="0" cy="-320" r="6" fill="#ffffff" filter="url(#bloomCyan)"/>
      <circle cx="320" cy="0" r="6" fill="#ffffff" filter="url(#bloomCyan)"/>
    </g>

    <!-- L3: The Trigram Ring (Hardcore Neon Symbols) -->
    <g class="ring-cw" style="animation-duration: 45s;" filter="url(#bloomCyan)">
      <circle cx="0" cy="0" r="260" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
      <!-- Place the 8 Trigrams at 45 degree intervals, each rotated to face OUTWARD -->
      <g transform="rotate(0) translate(0, -260)"><use href="#tri-qian"/></g>
      <g transform="rotate(45) translate(0, -260)"><use href="#tri-xun"/></g>
      <g transform="rotate(90) translate(0, -260)"><use href="#tri-kan"/></g>
      <g transform="rotate(135) translate(0, -260)"><use href="#tri-gen"/></g>
      <g transform="rotate(180) translate(0, -260)"><use href="#tri-kun"/></g>
      <g transform="rotate(225) translate(0, -260)"><use href="#tri-zhen"/></g>
      <g transform="rotate(270) translate(0, -260)"><use href="#tri-li"/></g>
      <g transform="rotate(315) translate(0, -260)"><use href="#tri-dui"/></g>
    </g>

    <!-- Network Lines between Trigrams & Inner Core -->
    <g opacity="0.3" stroke="#0088ff" stroke-width="1">
      <!-- Crosses -->
      <line x1="-260" y1="0" x2="260" y2="0"/>
      <line x1="0" y1="-260" x2="0" y2="260"/>
      <line x1="-184" y1="-184" x2="184" y2="184"/>
      <line x1="-184" y1="184" x2="184" y2="-184"/>
    </g>

    <!-- L4: Inner Tech Rings -->
    <g class="ring-ccw" style="animation-duration: 25s;">
      <circle cx="0" cy="0" r="160" fill="none" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="8 8" filter="url(#bloomGold)" opacity="0.8"/>
    </g>

    <g class="ring-cw" style="animation-duration: 30s;">
      <circle cx="0" cy="0" r="130" fill="none" stroke="#00ffff" stroke-width="0.5"/>
      <polygon points="0,-130 92,-92 130,0 92,92 0,130 -92,92 -130,0 -92,-92" fill="#00d09c" fill-opacity="0.05" stroke="#00d09c" stroke-width="1"/>
    </g>

    <!-- Orbiting Energy Particles (Using animateMotion along circular path) -->
    <g>
      <circle cx="0" cy="0" r="8" fill="#fff" filter="url(#bloomCyan)">
        <animateMotion dur="10s" repeatCount="indefinite" path="M -200,0 A 200,200 0 1,1 200,0 A 200,200 0 1,1 -200,0" />
      </circle>
      <circle cx="0" cy="0" r="5" fill="#fff" filter="url(#bloomGold)">
        <!-- Opposite direction (path drawn counter-clockwise) -->
        <animateMotion dur="6s" repeatCount="indefinite" path="M 120,0 A 120,120 0 1,0 -120,0 A 120,120 0 1,0 120,0" />
      </circle>
    </g>

    <!-- L5: The Cybernetic Taichi Core (Yin Yang) -->
    <g class="core-spin" filter="url(#bloomCyan)">
      <circle cx="0" cy="0" r="80" fill="#001122" stroke="#00ffff" stroke-width="3"/>
      <!-- Yang (Bright side) -->
      <path d="M0,80 A80,80 0 0,0 0,-80 A40,40 0 0,0 0,0 A40,40 0 0,1 0,80 Z" fill="#00ffff" opacity="0.8"/>
      <!-- Yin (Dark side) -->
      <path d="M0,80 A80,80 0 0,1 0,-80 A40,40 0 0,0 0,0 A40,40 0 0,1 0,80 Z" fill="#00d09c" opacity="0.8"/>
      
      <!-- Seed dots -->
      <circle cx="0" cy="-40" r="10" fill="#001122"/>
      <circle cx="0" cy="40" r="10" fill="#ffffff" filter="url(#bloomCyan)"/>
    </g>

  </g> <!-- End of 3D Matrix Projection -->

  <!-- Vertical Energy Beam intersecting the 3D plane (Not flattened) -->
  <g>
    <!-- Back layer of beam -->
    <rect x="580" y="0" width="40" height="800" fill="url(#verticalBeam)" />
    <!-- Core extremely bright beam -->
    <rect x="595" y="0" width="10" height="800" fill="#ffffff" opacity="0.8" filter="url(#bloomCyan)"/>
    
    <!-- Pulse glowing center knot where beam hits disk -->
    <ellipse cx="600" cy="400" rx="60" ry="15" fill="#ffffff" opacity="0.9" filter="url(#bloomCyan)"/>
  </g>

  <!-- Scanning Hologram Effect over entire canvas -->
  <rect x="0" y="0" width="1200" height="800" class="scan" pointer-events="none"/>

  <!-- Static HUD Interface Overlays (Flat 2D layer, not affected by 3D transform) -->
  <g class="tech-text" opacity="0.8">
    <!-- Top Left -->
    <text x="40" y="40">SYS.INIT.HQ</text>
    <text x="40" y="60">SECURE_CHANNEL: ACTIVE</text>
    <path d="M 30,70 L 150,70 L 160,80" fill="none" stroke="#0088ff" stroke-width="1.5"/>
    
    <!-- Top Right -->
    <text x="1000" y="40">SECTOR: DIAGNOSIS</text>
    <text x="1030" y="60">QIMEN DUNJIA</text>
    <text x="1055" y="80">V9.9.0</text>
    <path d="M 1160,90 L 1030,90 L 1020,100" fill="none" stroke="#0088ff" stroke-width="1.5"/>

    <!-- Bottom Data Stream Values -->
    <text x="40" y="740">LATENCY: 12ms</text>
    <text x="40" y="760">NODES_ONLINE: 8/8</text>
    <text x="40" y="780">ENERGY_SIG: NOMINAL</text>

    <!-- Radar / Calibrator Bottom Right -->
    <g transform="translate(1100, 740)" stroke="#00d09c" stroke-width="1" fill="none">
      <circle cx="0" cy="0" r="30" stroke-dasharray="2 4" />
      <circle cx="0" cy="0" r="20" opacity="0.5"/>
      <line x1="-35" y1="0" x2="35" y2="0" />
      <line x1="0" y1="-35" x2="0" y2="35" />
      <!-- Pulsing radar blip -->
      <circle cx="15" cy="-15" r="2" fill="#00d09c">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

</svg>