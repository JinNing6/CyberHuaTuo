name: "💡 功能建议"
description: "提出新功能或改进建议"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你想解决什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你的想法是什么？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 有没有考虑过其他替代方案？
    validations:
      required: false
