name: 📊 Update Epidemic Report

on:
  push:
    branches: [main]
    paths:
      - 'cases/**'
  schedule:
    - cron: '0 0 * * *'  # 每日 UTC 0:00
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

# 防止同一工作流并行运行，后触发的排队等待
concurrency:
  group: epidemic-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-report:
    name: 生成疫情通报
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 完整历史，rebase 需要

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate report
        run: python tools/stats.py

      - name: Commit & Push
        run: |
          git config user.name "CyberHuaTuo Bot"
          git config user.email "bot@cyberhuatuo.dev"
          git add EPIDEMIC_REPORT.md
          # 无变更则跳过
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 Update epidemic report [skip ci]"
          # 拉取远端最新（解决并发推送冲突）+ 重试
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "⚠️ Push failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
