name: 📊 Update Epidemic Report

on:
  push:
    branches: [main]
    paths:
      - 'cases/**'
  schedule:
    - cron: '0 0 * * *'  # 每日 UTC 0:00
  workflow_dispatch:  # 手动触发

jobs:
  update-report:
    name: 生成疫情通报
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate report
        run: python tools/stats.py

      - name: Commit & Push
        run: |
          git config user.name "CyberHuaTuo Bot"
          git config user.email "bot@cyberhuatuo.dev"
          git add EPIDEMIC_REPORT.md
          git diff --cached --quiet || git commit -m "📊 Update epidemic report [skip ci]"
          git push
