name: 🏆 Update Alchemist Apotheosis Board

on:
  push:
    branches:
      - main
    paths:
      - 'cases/**'
      - '.github/workflows/update_leaderboard.yml'
      - 'tools/update_leaderboard.py'

  # 药方晋升完成后自动触发（近实时）
  workflow_run:
    workflows: ["💊 Promote Prescription"]
    types: [completed]

  # 每小时定时同步（兜底）
  schedule:
    - cron: '0 * * * *'

  # 支持手动触发
  workflow_dispatch:

# 防止同一工作流并行运行（多种触发源可能同时激活）
concurrency:
  group: update-leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install dependencies
        run: pip install pyyaml

      - name: 🧬 Run Alchemist Leaderboard Generator
        run: python tools/update_leaderboard.py
        
      - name: 📝 Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(leaderboard): 🏆 auto-sync alchemist apotheosis board"
          file_pattern: "README.md README_CN.md"
          commit_user_name: "CyberHuaTuo Bot"
          commit_user_email: "bot@cyberhuatuo.dev"
          commit_author: "CyberHuaTuo Bot <bot@cyberhuatuo.dev>"
