# ============================================================
# 🩺 CyberHuaTuo CI — 望闻问切 四步审核
# The Four-Step Diagnostic CI Pipeline
# ============================================================
# 望 (Look)    → 病例格式校验
# 闻 (Listen)  → 代码质量检查
# 问 (Ask)     → 功能测试
# 切 (Diagnose) → 智能审查
# ============================================================

name: 🩺 望闻问切 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ════════════════════════════════════════════════════
  #  第一步 · 望 (Look) — 病例格式校验
  #  检查 cases/ 目录下的病例文件格式是否规范
  # ════════════════════════════════════════════════════
  look:
    name: 🔮 望 · Case Format Validation
    runs-on: ubuntu-latest
    # 仅在 cases/ 有变更时运行，或在 main 分支 push 时始终运行
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: 🔮 望诊 — 校验病例格式
        run: |
          echo "🩺 赛博华佗 · 望诊开始..."
          echo "═══════════════════════════════════════"
          python tools/validate.py --verbose
          echo "═══════════════════════════════════════"
          echo "🔮 望诊完成 ✅"

  # ════════════════════════════════════════════════════
  #  第二步 · 闻 (Listen) — 代码质量检查
  #  Lint, Format, Security Scan
  # ════════════════════════════════════════════════════
  listen:
    name: 🩺 闻 · Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install linting tools
        run: pip install ruff bandit

      - name: 🔍 Ruff Lint — 代码规范检查
        run: |
          echo "🩺 赛博华佗 · 闻诊 — 代码脉象..."
          ruff check cyberhuatuo/ tools/ --output-format=github
        continue-on-error: false

      - name: 🎨 Ruff Format Check — 代码风格检查
        run: |
          ruff format --check cyberhuatuo/ tools/
        continue-on-error: true

      - name: 🔒 Bandit Security Scan — 安全扫描
        run: |
          echo "🔒 安全扫描..."
          bandit -r cyberhuatuo/ -ll --format json --output bandit-report.json || true
          bandit -r cyberhuatuo/ -ll || true
        continue-on-error: true

  # ════════════════════════════════════════════════════
  #  第三步 · 问 (Ask) — 功能测试
  #  Multi-version pytest
  # ════════════════════════════════════════════════════
  ask:
    name: 🧪 问 · Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: 🧪 问诊 — 运行测试
        run: |
          echo "🩺 赛博华佗 · 问诊 — 功能检测..."
          pytest tests/ -v --tb=short --co -q 2>/dev/null || echo "⚠️ 无测试文件或无法收集测试"
          pytest tests/ -v --tb=short || echo "⚠️ 测试未通过或无测试，请检查"
        continue-on-error: true

  # ════════════════════════════════════════════════════
  #  第四步 · 切 (Diagnose) — 智能审查
  #  Auto-label, summary, reviewer assignment
  # ════════════════════════════════════════════════════
  diagnose:
    name: 💊 切 · Smart Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [look, listen]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 💊 切诊 — 生成变更摘要
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // 统计变更
            let casesAdded = 0;
            let casesModified = 0;
            let engineChanged = false;
            let toolsChanged = false;
            let docsChanged = false;
            const frameworks = new Set();

            for (const file of files) {
              if (file.filename.startsWith('cases/')) {
                if (file.status === 'added') casesAdded++;
                else casesModified++;
                // 提取框架名
                const parts = file.filename.split('/');
                if (parts.length > 1) frameworks.add(parts[1]);
              }
              if (file.filename.startsWith('cyberhuatuo/')) engineChanged = true;
              if (file.filename.startsWith('tools/')) toolsChanged = true;
              if (file.filename.endsWith('.md')) docsChanged = true;
            }

            // 构建摘要
            let summary = '## 🩺 赛博华佗 · 切诊报告\n\n';
            summary += '| 项目 | 详情 |\n|------|------|\n';
            summary += `| 📁 变更文件数 | ${files.length} |\n`;
            if (casesAdded > 0) summary += `| 💊 新增病例 | ${casesAdded} |\n`;
            if (casesModified > 0) summary += `| ✏️ 修改病例 | ${casesModified} |\n`;
            if (frameworks.size > 0) summary += `| 🔧 涉及框架 | ${[...frameworks].join(', ')} |\n`;
            if (engineChanged) summary += `| ⚙️ 引擎变更 | ✅ |\n`;
            if (toolsChanged) summary += `| 🛠️ 工具变更 | ✅ |\n`;
            if (docsChanged) summary += `| 📝 文档变更 | ✅ |\n`;

            summary += '\n---\n';
            summary += '*此报告由 🩺 赛博华佗 CI 自动生成*\n';

            // 发布评论（检查是否已存在，避免重复）
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('赛博华佗 · 切诊报告')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }

      - name: 🏷️ 自动打标
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = new Set();
            for (const file of files) {
              if (file.filename.startsWith('cases/')) labels.add('prescription');
              if (file.filename.startsWith('cyberhuatuo/')) labels.add('engine');
              if (file.filename.startsWith('tools/')) labels.add('tooling');
              if (file.filename.endsWith('.md') && !file.filename.startsWith('cases/')) labels.add('documentation');
              if (file.filename.startsWith('tests/')) labels.add('testing');
            }

            if (labels.size > 0) {
              // 确保标签存在
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                  });
                } catch (e) {
                  const colors = {
                    prescription: '00D09C',
                    engine: '00BFFF',
                    tooling: 'FFD700',
                    documentation: 'C5DEF5',
                    testing: 'BFD4F2',
                  };
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: colors[label] || 'EDEDED',
                  });
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              });
            }
